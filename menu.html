<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0806">
<link rel="icon" href="icon-192.png">
<title>Chai &amp; Chill - Menu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0806;color:#f4ead6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px 14px 40px}
.hero{text-align:center;padding:10px 0 18px}
.hero img{width:130px;height:130px;border-radius:50%;box-shadow:0 8px 28px #000}
.hero h1{font-family:Georgia,"Times New Roman",serif;color:#f1c15c;font-size:34px;margin:12px 0 2px;letter-spacing:1.5px}
.hero p{margin:0;color:#b9a77d;font-size:14px;letter-spacing:3px}
.title{display:flex;align-items:center;gap:12px;margin:12px 0 16px;color:#e9b44c;font-weight:bold;letter-spacing:3px;font-size:14px}
.title:before,.title:after{content:"";flex:1;height:1px;background:#3a2f18}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
.card{background:#15110a;border:1px solid #3a2f18;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px #0008}
.pic{aspect-ratio:1/1;background:#1f1809;display:flex;align-items:center;justify-content:center;font-size:64px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:11px 12px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:bold;font-size:16px;line-height:1.25}
.price{background:#e9b44c;color:#1a1204;font-weight:900;border-radius:20px;padding:6px 11px;font-size:14px;white-space:nowrap}
.contact{margin-top:26px;text-align:center;border:1px solid #3a2f18;border-radius:16px;padding:16px;background:#110d07}
.contact div{color:#d8c89f;margin:3px 0;font-size:15px}
.call{display:inline-block;margin-top:10px;background:#e9b44c;color:#1a1204;font-weight:bold;text-decoration:none;border-radius:12px;padding:12px 22px;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="assets/logo.png" alt="Chai &amp; Chill"><h1>CHAI &amp; CHILL</h1><p>TEA SHOP</p></div>
  <div class="title">OUR MENU</div>
  <div id="grid" class="grid"></div>
  <div class="contact">
    <div>📍 Jumma Masjith Road, Oddamavadi - 02</div>
    <div>📞 0762277887</div>
    <a class="call" href="tel:0762277887">Call Us</a>
  </div>
</div>
<script src="menu-data.js?v=1"></script>
<script>
document.getElementById("grid").innerHTML=MENU.map(function(m){
  var pic=IMAGES[m.name]?'<img src="'+IMAGES[m.name]+'" alt="'+m.name+'">':m.icon;
  return '<div class="card"><div class="pic">'+pic+'</div><div class="info"><div class="name">'+m.name+'</div><div class="price">Rs. '+m.price+'</div></div></div>';
}).join("");
</script>
</body>
</html>
