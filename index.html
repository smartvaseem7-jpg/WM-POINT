<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAAI HAVEN - Tea Shop</title>
<link rel="stylesheet" href="style.css?v=28">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="script.js?v=23" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">☕</div><div><h1>CHAAI HAVEN</h1><p>Tea Shop</p></div></div>
    <button id="salesTopBtn" class="icon-btn" title="Today Sales">📊</button>
  </header>
  <nav class="tabs">
    <button class="tab active" data-view="home">⌂<span>Home</span></button>
    <button class="tab" data-view="billing">🛒<span>Billing</span></button>
    <button class="tab" data-view="sales">▥<span>Today Sales</span></button>
  </nav>
  <main>
    <section id="homeView" class="view active">
      <div class="hero"><div><small>WELCOME</small><h2>Good Food<br>Good Mood</h2><i></i></div><div class="hero-cup">☕</div></div>
      <div class="section-head"><div><small>OUR MENU</small><h2>Choose Items</h2></div></div>
      <div id="menuGrid" class="menu-grid"></div>
    </section>
    <section id="billingView" class="view">
      <div class="page-title"><div><small>NEW BILL</small><h2>Billing Counter</h2></div><button id="clearBtn" class="icon-btn">🗑</button></div>
      <button id="openMenu" class="add-items-btn">＋ Add Items</button>
      <div id="cart" class="cart"></div>
      <div class="bill-summary">
        <div><span>Total Items</span><b id="totalItems">0</b></div>
        <div class="grand-total"><span>Total Amount</span><strong>Rs. <span id="total">0</span></strong></div>
      </div>
      <div class="payment-card">
        <label>Payment</label>
        <div class="payment-options"><button class="pay active">💵 Cash</button><button class="pay">💳 Card</button></div>
        <label>Cash Received</label>
        <input id="cash" type="number" inputmode="decimal" placeholder="Enter cash amount">
        <div class="change" id="changeBox"><span id="changeLabel">Change</span><strong>Rs. <span id="change">0</span></strong></div>
      </div>
      <button id="printBtn" class="print-btn">🧾 Save & Print Bill</button>
    </section>
    <section id="salesView" class="view">
      <div class="page-title"><div><small>SALES REPORT</small><h2>Today Sales</h2></div><button id="resetSales" class="icon-btn" title="Reset selected date">↻</button></div>
      <div class="date-picker"><span>📅</span><input id="salesDate" type="date"><span>View Date</span></div>
      <div class="sales-hero"><small>TOTAL SALES</small><div class="big">Rs. <em id="salesTotal">0</em></div><div class="sub"><span><b id="billCount">0</b> bills</span><span><b id="itemsSold">0</b> items</span></div></div>
      <div id="topSeller" class="top-seller"></div>
      <div class="sales-card"><div class="card-title"><h3>Vitta Items</h3><small id="reportDate"></small></div><div id="salesTable"></div><div id="unsold" class="unsold"></div><div class="grand-report">Grand Total <b>Rs. <span id="grandTotal">0</span></b></div></div>
      <div class="sales-card"><div class="card-title"><h3>Bills</h3><small id="billsNote"></small></div><div id="billsList"></div></div>
    </section>
  </main>
</div>
<div id="drawerBack" class="drawer-back"></div>
<aside id="menuDrawer" class="drawer">
  <div class="drawer-head"><h3>Choose Items</h3><button id="closeMenu" class="icon-btn">✕</button></div>
  <div id="billingMenuGrid" class="menu-grid"></div>
  <div class="drawer-foot"><div id="dChips" class="chips"></div><div class="foot-row"><span><b id="dItems">0</b> items · Rs. <b id="dTotal">0</b></span><button id="doneMenu">Done</button></div></div>
</aside>
</body>
</html>
